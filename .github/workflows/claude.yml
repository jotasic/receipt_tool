name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]
  pull_request_review:
    types: [submitted]

jobs:
  # 이슈 생성 시 자동 요약 (Claude Code CLI가 읽기 좋은 형식)
  claude-auto-summary:
    if: github.event_name == 'issues' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      id-token: write
    steps:
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --allowedTools "Bash(gh issue:*)"
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ github.event.issue.number }}
            TITLE: ${{ github.event.issue.title }}
            BODY: ${{ github.event.issue.body }}

            위 이슈를 분석해서 아래 형식의 브리핑을 작성한 뒤,
            다음 명령으로 이슈에 댓글을 달아줘:
            gh issue comment ${{ github.event.issue.number }} --body "<브리핑 내용>"

            브리핑 형식 (한국어, 코드/파일명은 영어 유지):

            ## 🤖 Claude Code 작업 브리핑

            ### 작업 유형
            - **타입**: feat / fix / refactor / docs / chore 중 하나
            - **우선순위**: P0 (긴급) / P1 (높음) / P2 (보통)

            ### 요약
            1-2줄로 핵심 내용만

            ### 영향 범위
            - **에이전트**: react-native-expo-developer / database-specialist / doc-writer / architect 중 해당하는 것
            - **파일/모듈**: 수정이 예상되는 파일 또는 모듈 목록

            ### 구현 힌트
            - 핵심 로직 또는 접근 방법

            ### 완료 조건
            - [ ] 조건 1
            - [ ] 조건 2

            ### 주의사항
            다크모드, 타입 안전성, 한국어 UI 등 이슈 특성에 맞는 주의사항

  # @claude 멘션 시 대화형 응답
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && github.event.action != 'opened' && contains(github.event.issue.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
